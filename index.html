<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sử ký ôn thi · Lịch sử 11 · Giữa kì I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ===== CSS ===== */
:root{--paper:#F4EBD9;--paper-2:#EDE0C8;--ink:#3B2E2A;--ink-soft:#6B5B52;--accent:#8C2F24;--gold:#B8894A;--correct:#5C7A4A;--wrong:#A23B2E;--line:#C9B896;
--serif:"Playfair Display",Georgia,"Times New Roman",serif;--body:"EB Garamond",Georgia,"Times New Roman",serif;--mono:"IBM Plex Mono","Courier New",monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:19px/1.6 var(--body);min-height:100vh;
background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .5 0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.06'/></svg>"),linear-gradient(180deg,#F4EBD9,#EFE3CC) fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:32px 40px 64px}
header{text-align:center;position:relative;padding-top:8px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.3em;color:var(--gold)}
h1{font:700 30px/1.2 var(--serif);margin:.4em 0 0}
.seal{position:absolute;right:0;top:0;width:54px;height:54px;border:3px double var(--accent);border-radius:50%;color:var(--accent);display:grid;place-items:center;font:700 11px/1.1 var(--serif);transform:rotate(-14deg);opacity:.8;text-align:center;pointer-events:none}
.orn{display:flex;align-items:center;gap:12px;color:var(--gold);margin:18px 0;font-size:14px}
.orn::before,.orn::after{content:"";flex:1;border-top:1px solid var(--line)}
nav{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;justify-content:center}
nav .in{display:flex;max-width:720px;width:100%;padding:0 40px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 4px 9px;font:500 17px var(--body);color:var(--ink-soft);display:flex;gap:6px;justify-content:center;align-items:center}
.tab[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
section.panel{animation:fade .2s ease}
section[hidden]{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
h2{font:700 22px var(--serif);margin:0 0 6px}
.muted{color:var(--ink-soft);font-size:16px}
.box{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:26px 28px;box-shadow:inset 0 0 0 4px var(--paper-2),inset 0 0 0 5px var(--line)}
.btn{background:var(--accent);color:#FBF3E2;border:1px solid var(--ink);border-radius:6px;padding:9px 20px;font-weight:600;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--accent)}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.stamp{display:inline-block;font:500 13px var(--mono);border:1px dashed var(--ink-soft);padding:4px 10px;background:var(--paper);outline:3px solid var(--paper);outline-offset:-1px}
.stamp.v{writing-mode:horizontal-tb}
.bar{height:6px;background:var(--paper-2);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:10px 0 18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:16px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent);width:16px;height:16px}
/* quiz */
.qtext{font:700 21px/1.45 var(--serif);margin:0 0 20px}
.qtext b{color:var(--accent);text-decoration:underline}
.opt{position:relative;display:flex;gap:12px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:12px 38px 12px 14px;margin-bottom:10px;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--line);transition:transform .15s,border-color .15s}
.opt::after{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 16px 16px 0;border-color:transparent var(--paper-2) var(--line) transparent}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ink)}
.opt .k{font:500 14px/1.9 var(--mono);color:var(--gold);min-width:18px}
.opt:disabled{cursor:default;color:var(--ink)}
.opt.ok{background:#DCE5CC;border-color:var(--correct)}
.opt.no{background:#EBCFC3;border-color:var(--wrong)}
.opt .mk{margin-left:auto}
.shake{animation:shake .2s 2}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.note{font-style:italic;color:var(--ink-soft);border-left:2px solid var(--gold);padding:2px 0 2px 14px;margin:16px 0 4px;font-size:17px}
.sealstamp{position:absolute;right:16px;top:12px;width:78px;height:78px;border:4px double var(--accent);border-radius:50%;color:var(--accent);display:grid;place-items:center;font:800 15px var(--serif);opacity:.15;transform:rotate(-12deg);animation:stp .3s ease-out;pointer-events:none}
@keyframes stp{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
.score{font:800 56px var(--serif);color:var(--accent);margin:4px 0}
.wl{margin:8px 0;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:6px;font-size:17px}
/* flashcard */
.scene{perspective:1200px;margin:18px 0}
.fc{position:relative;height:340px;transform-style:preserve-3d;transition:transform .5s ease;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper-2);border:1px solid var(--line);border-radius:8px;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;overflow:auto;box-shadow:inset 0 0 0 5px var(--paper-2),inset 0 0 0 6px var(--line)}
.face.back{transform:rotateY(180deg);justify-content:flex-start}
.face .cn{position:absolute;width:20px;height:20px;border:2px solid var(--gold)}
.cn.a{left:12px;top:12px;border-right:0;border-bottom:0}.cn.b{right:12px;top:12px;border-left:0;border-bottom:0}
.cn.c{left:12px;bottom:12px;border-right:0;border-top:0}.cn.d{right:12px;bottom:12px;border-left:0;border-top:0}
.face h3{font:700 24px/1.4 var(--serif);margin:0;text-align:center}
.face ul{margin:0;padding-left:20px}.face li{margin:6px 0}
.kw{font-weight:700;color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.tags{text-align:center;margin-top:14px}
.tags span{font:400 12px var(--mono);color:var(--ink-soft);border:1px dashed var(--line);padding:2px 8px;margin:0 3px}
/* cloze */
.cz{margin-bottom:16px;line-height:2.3}
.cz input{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed var(--ink-soft);text-align:center;padding:0 4px;margin:0 4px;min-width:90px;border-radius:0}
.cz input:focus{outline:0;border-bottom-color:var(--accent);background:rgba(184,137,74,.12)}
.cz input.ok{border-bottom:2px solid var(--correct);color:var(--correct)}
.cz input.bad{border-bottom:2px solid var(--wrong);color:var(--wrong)}
.chip{font:500 13px var(--mono);background:#DCE5CC;border:1px solid var(--correct);padding:1px 8px;border-radius:4px;margin-right:4px}
.cn2{font:500 12px var(--mono);color:var(--gold);margin-right:6px}
/* theory */
.ac{border:1px solid var(--line);border-radius:8px;background:var(--paper-2);margin-bottom:12px;overflow:hidden}
.ac.pin{border-color:var(--accent)}
.ach{display:flex;align-items:center}
.ach>button.t{flex:1;background:none;border:0;text-align:left;padding:14px 16px;display:flex;gap:12px;align-items:center;font:700 18px/1.35 var(--serif)}
.arr{transition:transform .2s;color:var(--accent)}
.ac.open .arr{transform:rotate(90deg)}
.pb{background:none;border:0;font-size:18px;padding:10px 14px;opacity:.35;filter:grayscale(1)}
.pb[aria-pressed=true]{opacity:1;filter:none}
.acb{display:none;padding:2px 22px 16px 46px;border-top:1px dashed var(--line)}
.ac.open .acb{display:block}
.acb p{margin:6px 0}.acb .l1{padding-left:12px}.acb .l2{padding-left:30px}.acb .ar{color:var(--accent);font-style:italic}
.acb h4{font:700 16px var(--serif);margin:12px 0 2px;color:var(--accent)}
mark{background:rgba(184,137,74,.4);color:inherit;padding:0 1px}
.search{width:100%;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
/* toast */
#toasts{position:fixed;right:16px;bottom:16px;z-index:50;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--paper);border:1px solid var(--ink);border-radius:4px;padding:8px 14px 8px 12px;font:500 13px var(--mono);box-shadow:3px 3px 0 var(--gold);animation:fade .25s ease}
.toast::before{content:"✉ "}
@media(max-width:600px){.wrap{padding:20px 16px 48px}nav .in{padding:0 4px}.tab{flex-direction:column;gap:0;font-size:13px;padding:8px 2px 6px}.tab .ic{font-size:18px}.box{padding:20px 18px}.fc{height:380px}.face{padding:24px 20px}.seal{width:42px;height:42px;font-size:9px}h1{font-size:23px}body{font-size:18px}.qtext{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" style="padding-bottom:0">
<header>
 <div class="seal" aria-hidden="true">SỬ<br>KÝ</div>
 <div class="eyebrow">✦ SỬ KÝ ÔN THI ✦</div>
 <h1>Lịch sử 11 · Giữa kì I</h1>
 <div class="orn">✦</div>
</header>
</div>
<nav role="tablist" aria-label="Chọn phần ôn tập"><div class="in">
 <button class="tab" role="tab" data-tab="quiz"><span class="ic">📜</span><span>Trắc nghiệm</span></button>
 <button class="tab" role="tab" data-tab="cards"><span class="ic">🗂️</span><span>Flashcard</span></button>
 <button class="tab" role="tab" data-tab="cloze"><span class="ic">🖋️</span><span>Điền khuyết</span></button>
 <button class="tab" role="tab" data-tab="theory"><span class="ic">📚</span><span>Lý thuyết</span></button>
</div></nav>
<main class="wrap">
 <section class="panel" id="p-quiz" role="tabpanel"></section>
 <section class="panel" id="p-cards" role="tabpanel" hidden></section>
 <section class="panel" id="p-cloze" role="tabpanel" hidden></section>
 <section class="panel" id="p-theory" role="tabpanel" hidden></section>
</main>
<div id="toasts" aria-live="polite"></div>

<script>
/* ===== DATA ===== */
// Trắc nghiệm: trích từ file docx (đáp án đúng = chữ cái được gạch chân)
const QUESTIONS = [{"id": 1, "question": "Đẳng cấp thứ ba trong xã hội Pháp trước cách mạng gồm những lực lượng nào?", "options": {"A": "Tư sản, nông dân, bình dân thành thị.", "B": "Quý tộc, nông dân, tăng lữ, thợ thủ công.", "C": "Tăng lữ, quý tộc và tư sản, nông dân.", "D": "Vua, quan lại, tăng lữ, bình dân thành thị"}, "answer": "A", "explain": "Đáp án A. Xã hội Pháp trước 1789 có 3 đẳng cấp: Tăng lữ (thứ nhất), Quý tộc (thứ hai), còn Đẳng cấp thứ ba gồm tư sản, nông dân, bình dân thành thị."}, {"id": 2, "question": "Lực lượng nào sau đây thuộc Đẳng cấp thứ nhất trong xã hội Pháp (cuối thế kỉ XVIII)?", "options": {"A": "Giai cấp tư sản.", "B": "Nông dân.", "C": "Tăng lữ Giáo hội.", "D": "Bình dân thành thị."}, "answer": "C", "explain": "Đáp án C. Xã hội Pháp trước 1789 có 3 đẳng cấp: Tăng lữ (thứ nhất), Quý tộc (thứ hai), còn Đẳng cấp thứ ba gồm tư sản, nông dân, bình dân thành thị."}, {"id": 3, "question": "Từ thế kỉ XVII, nền nông nghiệp Anh có đặc điểm nổi bật nào sau đây?", "options": {"A": "Lạc hậu, manh mún, công cụ lao động thô sơ", "B": "Bị cạnh tranh gay gắt bởi nông nghiệp Pháp.", "C": "Phương thức kinh doanh mới thâm nhập mạnh", "D": "Phát triển mạnh mẽ trong ngành đồn điền cao su."}, "answer": "C", "explain": "Đáp án C. Tiền đề: CNTB ra đời trong lòng chế độ phong kiến/thuộc địa, xuất hiện giai cấp mới; tư tưởng tiến bộ (Triết học Ánh sáng); ở Bắc Mỹ nổi bật mâu thuẫn dân tộc giữa thuộc địa và thực dân Anh."}, {"id": 4, "question": "Một trong những lực lượng lãnh đạo chủ yếu của các cuộc cách mạng tư sản thế kỉ XVI - XVIII là giai cấp", "options": {"A": "tư sản.", "B": "công nhân.", "C": "nông dân.", "D": "địa chủ."}, "answer": "A", "explain": "Đáp án A. Tiền đề: CNTB ra đời trong lòng chế độ phong kiến/thuộc địa, xuất hiện giai cấp mới; tư tưởng tiến bộ (Triết học Ánh sáng); ở Bắc Mỹ nổi bật mâu thuẫn dân tộc giữa thuộc địa và thực dân Anh."}, {"id": 5, "question": "Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mỹ (cuối thế kỉ XVIII) bùng nổ trên cơ sở tiền đề xã hội nào sau đây?", "options": {"A": "Mâu thuẫn giữa quần chúng nhân dân với các thế lực phong kiến chuyên chế.", "B": "Mâu thuẫn giữa đẳng cấp thứ ba với đẳng cấp Tăng lữ Giáo hội và Quý tộc.", "C": "Mâu thuẫn dân tộc giữa nhân dân thuộc địa với chính quyền thực dân xâm lược.", "D": "Mâu thuẫn giai cấp giữa quý tộc phong kiến với nông dân và bình dân thành thị."}, "answer": "C", "explain": "Đáp án C. Tiền đề: CNTB ra đời trong lòng chế độ phong kiến/thuộc địa, xuất hiện giai cấp mới; tư tưởng tiến bộ (Triết học Ánh sáng); ở Bắc Mỹ nổi bật mâu thuẫn dân tộc giữa thuộc địa và thực dân Anh."}, {"id": 6, "question": "Ở Pháp, nền tảng của hệ tư tưởng dân chủ tư sản chính là", "options": {"A": "Cải cách tôn giáo.", "B": "Văn hóa Phục hưng.", "C": "thuyết Kinh tế học cổ điển.", "D": "Triết học Ánh sáng."}, "answer": "D", "explain": "Đáp án D. Tiền đề: CNTB ra đời trong lòng chế độ phong kiến/thuộc địa, xuất hiện giai cấp mới; tư tưởng tiến bộ (Triết học Ánh sáng); ở Bắc Mỹ nổi bật mâu thuẫn dân tộc giữa thuộc địa và thực dân Anh."}, {"id": 7, "question": "Các cuộc cách mạng tư sản đều hướng tới thực hiện mục tiêu nào sau đây?", "options": {"A": "Xây dựng nhà nước pháp quyền và thúc đẩy sự phát triển của nền kinh tế tự nhiên.", "B": "Xóa bỏ những trở ngại trên con đường xác lập và phát triển của chủ nghĩa tư bản.", "C": "Thiết lập nền chuyên chính vô sản, đưa nhân dân lao động lên nắm chính quyền.", "D": "Duy trì, bảo vệ và củng cố nền cai trị của nhà nước phong kiến chuyên chế."}, "answer": "B", "explain": "Đáp án B. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 8, "question": "Nhiệm vụ dân chủ của các cuộc cách mạng tư sản thời cận đại là gì?", "options": {"A": "Xóa bỏ tình trạng phong kiến cát cứ.", "B": "Thống nhất thị trường dân tộc.", "C": "Xóa bỏ tính chất chuyên chế phong kiến.", "D": "Hình thành quốc gia dân tộc."}, "answer": "C", "explain": "Đáp án C. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 9, "question": "Điểm tương đồng giữa Cách mạng tư sản Anh, Chiến tranh giành độc lập của 13 thuộc địa ở Bắc Mỹ và Cách mạng tư sản Pháp là gì?", "options": {"A": "Giai cấp tư sản độc quyền lãnh đạo cách mạng.", "B": "Mở đường cho sự phát triển của chủ nghĩa tư bản.", "C": "Sau cách mạng, chế độ quân chủ lập hiến được thiết lập.", "D": "Sử dụng tôn giáo cải cách làm “ngọn cờ” tập hợp lực lượng."}, "answer": "B", "explain": "Đáp án B. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 10, "question": "Khẩu hiệu nổi tiếng nào dưới đây có nguồn gốc từ cuộc Cách mạng tư sản Pháp (cuối thế kỉ XVIII)?", "options": {"A": "“Độc lập - Tự do - hạnh phúc”.", "B": "“Tự do - Bình đẳng - Bác ái”.", "C": "“Tự do, dân chủ, cơm áo và hòa bình”.", "D": "“Thống nhất hoàn toàn hay là chết?”."}, "answer": "B", "explain": "Đáp án B. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 11, "question": "Khi soạn thảo Tuyên ngôn Độc lập cho nhà nước Việt Nam Dân chủ Cộng hòa, Chủ tịch Hồ Chí Minh đã trích dẫn một phần nội dung trong bản tuyên ngôn nào dưới đây?", "options": {"A": "Tuyên ngôn Độc lập (Mỹ, 1776).", "B": "Tuyên ngôn hòa bình (Ấn Độ, 1920).", "C": "Tuyên ngôn của Đảng Cộng sản (1848).", "D": "Tuyên ngôn Giải phóng nô lệ (Mỹ, 1862)."}, "answer": "A", "explain": "Đáp án A. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 12, "question": "“Xây dựng nhà nước pháp quyền, là nhà nước dân chủ tư sản, dựa trên việc quản lí đất nước bằng pháp luật” - đó là mục tiêu cụ thể của các cuộc cách mạng tư sản trên lĩnh vực", "options": {"A": "kinh tế.", "B": "chính trị.", "C": "văn hóa.", "D": "giáo dục."}, "answer": "B", "explain": "Đáp án B. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 13, "question": "Cuộc cách mạng tư sản nào đã đánh dấu sự mở rộng của chủ nghĩa tư bản ở ngoài châu Âu?", "options": {"A": "Nội chiến ở Anh (thế kỉ XVII).", "B": "Đại cách mạng Pháp (thế kỉ XVIII).", "C": "Đấu tranh thống nhất nước Đức (thế kỉ XIX).", "D": "Chiến tranh giành độc lập của 13 thuộc địa Anh ở Bắc Mỹ"}, "answer": "D", "explain": "Đáp án D. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 14, "question": "Cuối thế kỉ XIX - đầu thế kỉ XX, các nước tư bản chuyển sang giai đoạn", "options": {"A": "tự do cạnh tranh.", "B": "đế quốc chủ nghĩa.", "C": "chủ nghĩa tư bản hiện đại.", "D": "chủ nghĩa dân tộc cực đoan."}, "answer": "B", "explain": "Đáp án B. Cuối XIX – đầu XX, CNTB chuyển sang giai đoạn độc quyền (đế quốc chủ nghĩa); các nước đế quốc đẩy mạnh xâm lược thuộc địa, CNTB mở rộng ảnh hưởng trên toàn thế giới."}, {"id": 15, "question": "Cuộc Duy tân Minh Trị ở Nhật Bản (bắt đầu từ năm 1868) mang tính chất của một cuộc cách mạng tư sản, diễn ra dưới hình thức", "options": {"A": "nội chiến cách mạng.", "B": "cải cách, canh tân đất nước.", "C": "chiến tranh giành độc lập.", "D": "đấu tranh thống nhất đất nước."}, "answer": "B", "explain": "Đáp án B. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 16, "question": "Mức độ thắng lợi của các cuộc cách mạng tư sản thời cận đại khác nhau là do", "options": {"A": "điều kiện lịch sử.", "B": "giai cấp lãnh đạo.", "C": "động lực cách mạng.", "D": "nhiệm vụ cách mạng."}, "answer": "A", "explain": "Đáp án A. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 17, "question": "Điểm khác biệt về tình hình chính trị Bắc Mĩ so với nước Anh và Pháp trước khi cách mạng tư sản bùng nổ thế kỉ XVIII là", "options": {"A": "thực dân phương Tây thống trị", "B": "chế độ phong kiến kìm hãm.", "C": "xuất hiện tầng lớp quí tộc mới.", "D": "xã hội tồn tại chế độ đẳng cấp."}, "answer": "A", "explain": "Đáp án A. Tiền đề: CNTB ra đời trong lòng chế độ phong kiến/thuộc địa, xuất hiện giai cấp mới; tư tưởng tiến bộ (Triết học Ánh sáng); ở Bắc Mỹ nổi bật mâu thuẫn dân tộc giữa thuộc địa và thực dân Anh."}, {"id": 18, "question": "Điểm chung trong tiền đề tư tưởng của các cuộc cách mạng tư sản thế kỉ XVII - XVIII là", "options": {"A": "Xuất hiện trào lưu tư tưởng tiến bộ của tư sản.", "B": "Xuất hiện trào lưu triết học ánh sáng.", "C": "Xuất hiện các giai cấp, tầng lớp xã hội mới.", "D": "Xuất hiện trào lưu xã hội không tưởng."}, "answer": "A", "explain": "Đáp án A. Tiền đề: CNTB ra đời trong lòng chế độ phong kiến/thuộc địa, xuất hiện giai cấp mới; tư tưởng tiến bộ (Triết học Ánh sáng); ở Bắc Mỹ nổi bật mâu thuẫn dân tộc giữa thuộc địa và thực dân Anh."}, {"id": 19, "question": "“Giải phóng dân tộc, lập nên quốc gia mới” là mục tiêu của cuộc cách mạng tư sản nào sau đây?", "options": {"A": "Cách mạng tư sản Anh.", "B": "Cuộc chiến tranh giành độc lập 13 bang thuộc địa Bắc Mỹ.", "C": "Cách mạng tư sản Pháp năm 1789.", "D": "Cuộc đấu tranh thống nhất nước Đức, I-ta-li-a."}, "answer": "B", "explain": "Đáp án B. Cách mạng tư sản: mục tiêu xoá bỏ rào cản, mở đường cho CNTB; hai nhiệm vụ dân tộc và dân chủ; mức độ thắng lợi khác nhau do điều kiện lịch sử; chiến tranh giành độc lập ở Bắc Mỹ mở rộng CNTB ngoài châu Âu."}, {"id": 20, "question": "Sự phát triển của nền kinh tế đã làm biến đổi xã hội Tây Âu và Bắc Mỹ, xuất hiện các giai cấp, tầng lớp mới đại diện cho phương thức sản xuất", "options": {"A": "tư bản chủ nghĩa.", "B": "phong kiến.", "C": "xã hội chủ nghĩa.", "D": "chiếm hữu nô lệ."}, "answer": "A", "explain": "Đáp án A. Tiền đề: CNTB ra đời trong lòng chế độ phong kiến/thuộc địa, xuất hiện giai cấp mới; tư tưởng tiến bộ (Triết học Ánh sáng); ở Bắc Mỹ nổi bật mâu thuẫn dân tộc giữa thuộc địa và thực dân Anh."}, {"id": 21, "question": "Nội dung nào sau đây phản ánh đúng đặc trưng của chủ nghĩa tư bản hiện đại?", "options": {"A": "Sự dung hợp tư bản ngân hàng với tư bản công nghiệp thành tư bản tài chính.", "B": "Xuất hiện các tổ chức độc quyền có vai trò quyết định trong sinh hoạt kinh tế.", "C": "Có sức sản xuất cao dựa trên thành tựu của cách mạng khoa học - công nghệ.", "D": "Các cường quốc tư bản lớn nhất đã chia nhau xong đất đai trên thế giới."}, "answer": "C", "explain": "Đáp án C. CNTB hiện đại (sau Chiến tranh thế giới thứ hai): kết hợp độc quyền tư nhân với nhà nước tư sản, sức sản xuất cao nhờ cách mạng khoa học - công nghệ, luôn điều chỉnh để tồn tại; vẫn đối mặt thách thức như chênh lệch giàu nghèo."}, {"id": 22, "question": "Một trong những tiềm năng của chủ nghĩa tư bản hiện đại là", "options": {"A": "thu hẹp được khoảng cách giàu - nghèo trong xã hội.", "B": "giải quyết một cách triệt để mọi mâu thuẫn trong xã hội.", "C": "có bề dày kinh nghiệm và phương pháp quản lí kinh tế.", "D": "hạn chế và tiến tới xóa bỏ sự bất bình đẳng trong xã hội."}, "answer": "C", "explain": "Đáp án C. CNTB hiện đại (sau Chiến tranh thế giới thứ hai): kết hợp độc quyền tư nhân với nhà nước tư sản, sức sản xuất cao nhờ cách mạng khoa học - công nghệ, luôn điều chỉnh để tồn tại; vẫn đối mặt thách thức như chênh lệch giàu nghèo."}, {"id": 23, "question": "Phong trào “99 chống lại 1” diễn ra ở Mỹ đầu năm 2011 và nhanh chóng lan rộng ra nhiều nước tư bản đã cho thấy chủ nghĩa tư bản hiện đại đang phải đối mặt với thách thức nào sau đây?", "options": {"A": "Gia tăng tình trạng chênh lệch giàu - nghèo và bất bình đẳng xã hội.", "B": "Lực lượng lao động có trình độ chuyên môn nghiệp vụ yếu kém.", "C": "Thiếu khả năng tự điều chỉnh và thích nghi với bối cảnh mới.", "D": "Thiếu kinh nghiệm và phương pháp quản lí kinh tế."}, "answer": "A", "explain": "Đáp án A. CNTB hiện đại (sau Chiến tranh thế giới thứ hai): kết hợp độc quyền tư nhân với nhà nước tư sản, sức sản xuất cao nhờ cách mạng khoa học - công nghệ, luôn điều chỉnh để tồn tại; vẫn đối mặt thách thức như chênh lệch giàu nghèo."}, {"id": 24, "question": "Chủ nghĩa đế quốc là hệ quả trực tiếp của quá trình xâm lược thuộc địa nhằm", "options": {"A": "tìm kiếm thị trường, thu lợi nhuận và đầu tư tư bản ở nước ngoài.", "B": "giúp đỡ kinh tế và khai hóa văn minh cho các nước chậm phát triển.", "C": "di dân sang các nước chậm phát triển, giải quyết khủng hoảng dân số.", "D": "thúc đẩy sự giao lưu kinh tế và văn hóa giữa các quốc gia, dân tộc."}, "answer": "A", "explain": "Đáp án A. Cuối XIX – đầu XX, CNTB chuyển sang giai đoạn độc quyền (đế quốc chủ nghĩa); các nước đế quốc đẩy mạnh xâm lược thuộc địa, CNTB mở rộng ảnh hưởng trên toàn thế giới."}, {"id": 25, "question": "Trong những năm cuối thế kỉ XIX - đầu thế kỉ XX, cùng với việc các nước đế quốc đẩy mạnh xâm lược thuộc địa, chủ nghĩa tư bản đã", "options": {"A": "được xác lập ở châu Âu và khu vực Bắc Mỹ.", "B": "được xác lập ở các quốc gia: Pháp, Đức, I-ta-li-a,…", "C": "mở rộng phạm vi ảnh hưởng trên toàn thế giới.", "D": "suy yếu và bị thu hẹp phạm vi ảnh hưởng."}, "answer": "C", "explain": "Đáp án C. Cuối XIX – đầu XX, CNTB chuyển sang giai đoạn độc quyền (đế quốc chủ nghĩa); các nước đế quốc đẩy mạnh xâm lược thuộc địa, CNTB mở rộng ảnh hưởng trên toàn thế giới."}, {"id": 26, "question": "Sự ra đời của chính quyền Xô viết ở Nga gắn liền với sự kiện nào sau đây?", "options": {"A": "Cách mạng tháng Hai ở Nga thành công (1917).", "B": "Cách mạng tháng Mười ở Nga thành công (1917).", "C": "Chính sách Cộng sản thời chiến được ban hành (1919).", "D": "Chính sách Kinh tế mới (NEP) được ban hành (1921)."}, "answer": "B", "explain": "Đáp án B. Liên Xô: Cách mạng tháng Mười 1917 lập chính quyền Xô viết; Liên bang Xô viết thành lập tháng 12/1922, Hiến pháp đầu tiên tháng 1/1924; mục tiêu hợp tác, giúp đỡ nhau cùng phát triển."}, {"id": 27, "question": "Sự kiện nào dưới đây đánh dấu mốc hoàn thành của quá trình thành lập Nhà nước Liên bang Cộng hòa xã hội chủ nghĩa Xô viết?", "options": {"A": "Nước Nga Xô viết thực hiện chính sách kinh tế mới (tháng 3/1921).", "B": "Bản Hiệp ước Liên bang được thông qua (tháng 12/1922).", "C": "Tuyên ngôn thành lập Liên bang Xô viết được thông qua (tháng 12/1922).", "D": "Bản Hiến pháp đầu tiên của Liên Xô được thông qua (tháng 1/1924)."}, "answer": "D", "explain": "Đáp án D. Liên Xô: Cách mạng tháng Mười 1917 lập chính quyền Xô viết; Liên bang Xô viết thành lập tháng 12/1922, Hiến pháp đầu tiên tháng 1/1924; mục tiêu hợp tác, giúp đỡ nhau cùng phát triển."}, {"id": 28, "question": "Tháng 12/1922 diễn ra sự kiện nào sau đây?", "options": {"A": "Bản Hiến pháp đầu tiên của Liên Xô được thông qua.", "B": "Liên bang Cộng hòa xã hội chủ nghĩa Xô viết được thành lập.", "C": "Nước Nga Xô viết tiến hành chính sách Cộng sản thời chiến.", "D": "Nước Nga Xô viết tiến hành chính sách Kinh tế mới (NEP)."}, "answer": "B", "explain": "Đáp án B. Liên Xô: Cách mạng tháng Mười 1917 lập chính quyền Xô viết; Liên bang Xô viết thành lập tháng 12/1922, Hiến pháp đầu tiên tháng 1/1924; mục tiêu hợp tác, giúp đỡ nhau cùng phát triển."}, {"id": 29, "question": "Mục tiêu của việc thành lập Nhà nước Liên bang Cộng hòa xã hội chủ nghĩa Xô viết là", "options": {"A": "chống lại sự tấn công của 14 nước đế quốc.", "B": "thực hiện hiệu quả Chính sách Kinh tế mới.", "C": "hợp tác, giúp đỡ lẫn nhau để cùng phát triển.", "D": "chống lại cuộc tấn công của phát xít Đức."}, "answer": "C", "explain": "Đáp án C. Liên Xô: Cách mạng tháng Mười 1917 lập chính quyền Xô viết; Liên bang Xô viết thành lập tháng 12/1922, Hiến pháp đầu tiên tháng 1/1924; mục tiêu hợp tác, giúp đỡ nhau cùng phát triển."}, {"id": 30, "question": "Dòng chữ trên Quốc huy của Liên Xô là", "options": {"A": "“Tự do - Bình đẳng - Bác ái”.", "B": "“Độc lập - Tự do - Hạnh phúc”.", "C": "“Thống nhất trong đa dạng”.", "D": "“Giai cấp vô sản thế giới đoàn kết lại”."}, "answer": "D", "explain": "Đáp án D. Liên Xô: Cách mạng tháng Mười 1917 lập chính quyền Xô viết; Liên bang Xô viết thành lập tháng 12/1922, Hiến pháp đầu tiên tháng 1/1924; mục tiêu hợp tác, giúp đỡ nhau cùng phát triển."}, {"id": 31, "question": "Từ năm 1991 đến nay, nhân dân một số nước ở khu vực nào sau đây tiến hành cải cách, đổi mới, kiên định con đường xã hội chủ nghĩa?", "options": {"A": "Châu Á.", "B": "Bắc Phi.", "C": "Tây Âu.", "D": "Nam Phi."}, "answer": "A", "explain": "Đáp án A. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 32, "question": "Tháng 12-1975, nhà nước nào sau đây được thành lập và đi lên xây dựng chủ nghĩa xã hội?", "options": {"A": "Cộng hòa nhân dân Trung Hoa.", "B": "Cộng hòa Inđônêxia.", "C": "Cộng hòa Dân chủ nhân dân Lào.", "D": "Cộng hòa Nhân dân Campuchia."}, "answer": "C", "explain": "Đáp án C. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 33, "question": "Trước năm 1945, quốc gia duy nhất trên thế giới đi theo con đường xã hội chủ nghĩa là", "options": {"A": "Liên Xô.", "B": "Trung Quốc.", "C": "Việt Nam.", "D": "Cu-ba."}, "answer": "A", "explain": "Đáp án A. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 34, "question": "Trong những năm 1945 -1949, các nước Đông Âu đã hoàn thành cuộc cách mạng dân chủ nhân dân thông qua việc tiến hành nhiều chính sách tiến bộ, ngoại trừ việc", "options": {"A": "tiến hành công nghiệp hóa, hiện đại hóa đất nước.", "B": "quốc hữu hóa các nhà máy, xí nghiệp của tư bản.", "C": "ban hành các quyền tự do, dân chủ.", "D": "cải cách ruộng đất."}, "answer": "A", "explain": "Đáp án A. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 35, "question": "Quốc gia nào say đây thành lập nhà nước dân chủ nhân dân ở Đông Âu trong giai đoạn 1945-1949?", "options": {"A": "Trung Quốc.", "B": "Ấn Độ.", "C": "Hà Lan.", "D": "Nam Tư."}, "answer": "D", "explain": "Đáp án D. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 36, "question": "Năm 1949, ở châu Á, quốc gia nào sau đây đi lên xây dựng chủ nghĩa xã hội?", "options": {"A": "Triều Tiên.", "B": "Cu Ba.", "C": "Trung Quốc.", "D": "Lào."}, "answer": "C", "explain": "Đáp án C. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 37, "question": "Thắng lợi của Hồng quân Liên Xô trong những năm 1944 – 1945 đã tạo điều kiện cho sự ra đời của nhà nước dân chủ nhân dân ở các nước", "options": {"A": "Đông Âu.", "B": "Tây Âu.", "C": "Nam Âu.", "D": "Bắc Âu."}, "answer": "A", "explain": "Đáp án A. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 38, "question": "Sau năm 1945, sự phát triển và mở rộng của chủ nghĩa xã hội diễn ra trên phạm vi nhiều khu vực, đó là", "options": {"A": "Khu vực Đông Âu, Tây Âu, Châu Á.", "B": "Khu vực Đông Âu, Châu Phi, Châu Á.", "C": "Khu vực Đông Âu, Châu Á, Châu Mỹ La - tinh.", "D": "Khu vực Đông Âu, Châu Á, Bắc Mỹ."}, "answer": "C", "explain": "Đáp án C. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 39, "question": "Nhận xét nào sau đây là đúng về tình hình kinh tế - xã hội các nước Đông Âu từ năm 1950 đến nửa đầu những năm 70 của thế kỉ XX?", "options": {"A": "Phát triển, đạt nhiều thành tựu.", "B": "Khủng hoảng trầm trọng.", "C": "Phát triển xen lẫn suy thoái,", "D": "Phát triển thần kì."}, "answer": "A", "explain": "Đáp án A. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 40, "question": "Từ năm 1949 đến nửa đầu những năm 70 của thế kỉ XX, các nước Đông Âu", "options": {"A": "đạt được nhiều thành tựu trong xây dựng chủ nghĩa xã hội.", "B": "thực hiện những nhiệm vụ của cách mạng dân chủ nhân dân.", "C": "lâm vào suy thoái, khủng hoảng kinh tế - xã hội trầm trọng.", "D": "tiến hành cải cách để đưa đất nước thoái khỏi khủng hoảng."}, "answer": "A", "explain": "Đáp án A. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 41, "question": "Nhiệm vụ chủ yếu của các nước Đông Âu từ năm 1950 đến đầu những năm 70 của thế kỉ XX là", "options": {"A": "xây dựng chủ nghĩa xã hội.", "B": "lật đổ chế độ quân chủ chuyên chế.", "C": "đánh bại chủ nghĩa phát xít.", "D": "lật đổ chế độ thực dân kiểu mới."}, "answer": "A", "explain": "Đáp án A. Sau 1945, CNXH mở rộng sang Đông Âu (dân chủ nhân dân 1945–1949), châu Á (Trung Quốc 1949, Việt Nam, Lào…) và Mỹ La-tinh (Cu-ba); Đông Âu 1950–đầu 70 đạt nhiều thành tựu."}, {"id": 42, "question": "Nội dung nào dưới đây <b>không</b> phản ánh đúng nguyên nhân dẫn đến sự sụp đổ của mô hình xã hội chủ nghĩa ở Đông Âu và Liên Xô?", "options": {"A": "Phạm nhiều sai lầm nghiêm trọng trong quá trình thực hiện cải cách, cải tổ.", "B": "Chế độ xã hội chủ nghĩa không phù hợp với nguyện vọng của nhân dân.", "C": "Không bắt kịp sự phát triển của cuộc cách mạng khoa học -công nghệ.", "D": "Hoạt động chống phá của các thế lực thù địch trong và ngoài nước."}, "answer": "B", "explain": "Đáp án B. Sụp đổ ở Liên Xô và Đông Âu: nguyên nhân chủ yếu là đường lối chủ quan, duy ý chí, tập trung quan liêu bao cấp, cải tổ sai lầm, không theo kịp cách mạng khoa học - công nghệ; là bước lùi tạm thời, nhiều bài học còn giá trị."}, {"id": 43, "question": "Công cuộc xây dựng chủ nghĩa xã hội từ sau năm 1991 tiếp tục được duy trì và đẩy mạnh ở những quốc gia nào sau đây?", "options": {"A": "Trung Quốc, Việt Nam, Lào, Cu-ba.", "B": "Trung Quốc, Nga, Việt Nam, Lào.", "C": "Hàn Quốc, Triều Tiên, Việt Nam, Cu-ba.", "D": "Lào, Cu-ba, Hàn Quốc, Nhật Bản."}, "answer": "A", "explain": "Đáp án A. Từ 1991 đến nay, Trung Quốc, Việt Nam, Lào, Cu-ba tiếp tục xây dựng CNXH; Trung Quốc cải cách mở cửa từ 1978 (đặc khu đầu tiên Thâm Quyến, kinh tế thứ hai thế giới 2010); Cu-ba chịu cấm vận kéo dài."}, {"id": 44, "question": "Nội dung nào sau đây <b>không</b> phản ánh đúng thành tựu mà nhân dân Trung Quốc đạt được trong công cuộc cải cách mở cửa (từ năm 1978 đến nay)?", "options": {"A": "Đời sống vật chất và tinh thần của nhân dân được cải thiện, nâng cao.", "B": "Xây dựng được nền kinh tế kế hoạch hóa tập trung, quan liêu, bao cấp.", "C": "Trung Quốc vươn lên trở thành nền kinh tế có quy mô lớn th n Xô chỉ là bước lùi tạm thời của chủ nghĩa xã hội” Nhận định trên đúng hay sai?", "options": {"A": "Đúng, vì nguyên nhân chính khiến Liên Xô tan rã là chủ quan, có thể sửa chữa.", "B": "Đúng, vì các nước xã hội chủ nghĩa khác sẽ viện trợ, giúp đỡ khôi phục Liên Xô.", "C": "Sai, vì những nguyên lý của chủ nghĩa Mác đã không còn phù hợp với thực tiễn.", "D": "Sai, vì người dân đã chán ghét sự thay đổi, muốn ổn định để phát triển kinh tế."}, "answer": "A", "explain": "Đáp án A. Sụp đổ ở Liên Xô và Đông Âu: nguyên nhân chủ yếu là đường lối chủ quan, duy ý chí, tập trung quan liêu bao cấp, cải tổ sai lầm, không theo kịp cách mạng khoa học - công nghệ; là bước lùi tạm thời, nhiều bài học còn giá trị."}, {"id": 53, "question": "“Vấn đề quan trọng nhất để duy trì chế độ xã hội chủ nghĩa là kiên quyết bảo vệ sự lãnh đạo tuyệt đối của Đảng cộng sản đối với đất nước”. Nhận định trên", "options": {"A": "Sai, vì còn nhiều yếu tố quan trọng khác để bảo vệ đất nước hiện nay.", "B": "Đúng, vì bài học từ sự thất bại của Liên Xô vẫn còn giá trị hiện thực.", "C": "Sai, vì để bảo vệ đất nước phải xây dựng được nền kinh tế phát triển.", "D": "Đúng, vì sẽ nhận được sự giúp đỡ của các nước xã hội chủ nghĩa khác."}, "answer": "B", "explain": "Đáp án B. Sụp đổ ở Liên Xô và Đông Âu: nguyên nhân chủ yếu là đường lối chủ quan, duy ý chí, tập trung quan liêu bao cấp, cải tổ sai lầm, không theo kịp cách mạng khoa học - công nghệ; là bước lùi tạm thời, nhiều bài học còn giá trị."}, {"id": 54, "question": "Một trong những khó khăn của Cuba trong công cuộc xây dựng chủ nghĩa xã hội từ 1991 đến nay là", "options": {"A": "lệnh cấm vận kéo dài của Mĩ và phương Tây.", "B": "sự chống phá quyết liệt của các thế lực thù địch.", "C": "mô hình kinh tế tập trung bao cấp kém hiệu quả.", "D": "mâu thuẫn sắc tộc, tôn giáo không thể điều hòa."}, "answer": "A", "explain": "Đáp án A. Từ 1991 đến nay, Trung Quốc, Việt Nam, Lào, Cu-ba tiếp tục xây dựng CNXH; Trung Quốc cải cách mở cửa từ 1978 (đặc khu đầu tiên Thâm Quyến, kinh tế thứ hai thế giới 2010); Cu-ba chịu cấm vận kéo dài."}, {"id": 55, "question": "Từ năm 1976 đến nay, nhân dân Việt Nam thực hiện nhiệm vụ chiến lược nào sau đây?", "options": {"A": "Xây dựng chủ nghĩa xã hội.", "B": "Kháng chiến chống Pháp.", "C": "Kháng chiến chống Mĩ.", "D": "Giải phóng dân tộc."}, "answer": "A", "explain": "Đáp án A. Từ 1991 đến nay, Trung Quốc, Việt Nam, Lào, Cu-ba tiếp tục xây dựng CNXH; Trung Quốc cải cách mở cửa từ 1978 (đặc khu đầu tiên Thâm Quyến, kinh tế thứ hai thế giới 2010); Cu-ba chịu cấm vận kéo dài."}];

{id:3,title:"3. Động lực, kết quả và ý nghĩa của các cuộc cách mạng tư sản",body:["## a. Động lực","+ Lãnh đạo","+ Quần chúng nhân dân (bao gồm nông dân, công nhân, bình dân thành thị, tiểu tư sản, nô lệ da đen,...) là lực lượng chính tham gia cách mạng tư sản để lật đổ chế độ phong kiến hoặc thực dân.","## b. Kết quả và ý nghĩa","- Lật đổ nền quân chủ chuyên chế hoặc giành độc lập, mở đường cho CNTB phát triển.","- Đầu thập kỉ 70 của thế kỉ XIX, chủ nghĩa tư bản được xác lập trên phạm vi thế giới.","- Cách mạng tư sản Pháp được đánh giá là cuộc cách mạng vĩ đại."]},
{id:4,title:"4. Chủ nghĩa tư bản từ tự do kinh doanh sang độc quyền",body:["- Cuối thế kỉ XIX – đầu thế kỉ XX, chủ nghĩa tư bản chuyển sang giai đoạn độc quyền.","- Nguyên nhân: Quá trình cạnh tranh gay gắt làm các xí nghiệp nhỏ phá sản, xuất hiện các xí nghiệp khổng lồ và các tổ chức độc quyền.","- Các hình thức độc quyền tiêu biểu: Các-ten, xanh-đi-ca ở Đức và Pháp; Tơ-rớt ở Mỹ.","- Trong giai đoạn này, các tổ chức tư bản độc quyền đã chi phối sự phát triển của toàn bộ nền kinh tế."]},
{id:5,title:"5. Khái niệm của chủ nghĩa tư bản hiện đại",body:["- Chủ nghĩa tư bản hiện đại là thuật ngữ dùng để chỉ một giai đoạn phát triển của chủ nghĩa tư bản từ sau Chiến tranh thế giới thứ hai đến nay với những biểu hiện mới:","+ Sự kết hợp giữa sức mạnh kinh tế của các tổ chức độc quyền tư nhân với sức mạnh chính trị của nhà nước tư sản.","+ Có sức sản xuất phát triển cao trên cơ sở những thành tựu của cách mạng khoa học - công nghệ.","+ Có lực lượng lao động đáp ứng sự phát triển nhảy vọt của nền sản xuất.","+ Đồng thời không ngừng điều chỉnh để tồn tại và phát triển trong bối cảnh mới."]},
{id:6,title:"6. Ý nghĩa của sự ra đời Liên bang Cộng hoà Xã hội Chủ nghĩa Xô viết",body:["## a. Ý nghĩa trong nước","- Phù hợp với lợi ích chung của các dân tộc trên đất nước Xô viết.","- Sức mạnh đoàn kết tạo điều kiện cho sự phát triển nhanh chóng về kinh tế, xã hội của tất cả các nước Cộng hoà, đồng thời tăng cường vị thế của Liên Xô trên trường quốc tế.","- Mở ra con đường giải quyết đúng đắn vấn đề dân tộc trên cơ sở bình đẳng và giúp đỡ lẫn nhau.","## b. Ý nghĩa quốc tế","- Trở thành biểu tượng và là chỗ dựa về tinh thần, vật chất cho phong trào cách mạng thế giới.","- Cổ vũ mạnh mẽ phong trào giải phóng dân tộc tại những nước thuộc địa ở châu Á, châu Phi và khu vực Mỹ La-tinh.","- Tạo tiền đề cho sự ra đời của hệ thống xã hội chủ nghĩa."]}
];

/* ===== CORE (state, toast, tabs) ===== */
const $=s=>document.querySelector(s);
const LS="ls_gki_progress";
let S={tab:"quiz",high:0,done:[],pins:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(LS))||{})}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;$("#toasts").append(t);setTimeout(()=>t.remove(),2800)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]/g,"");
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const orn=()=>'<div class="orn" aria-hidden="true">✦</div>';
function showTab(t){
 S.tab=t;save();
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
 document.querySelectorAll("section.panel").forEach(s=>{const on=s.id==="p-"+t;s.hidden=!on;if(on){s.style.animation="none";s.offsetHeight;s.style.animation=""}});
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

/* ===== TRẮC NGHIỆM ===== */
const Q={order:[],i:0,sel:null,score:0,wrong:[],sq:false,so:false,keys:["A","B","C","D"],total:0};
const qById=id=>QUESTIONS.find(q=>q.id===id);
function quizStart(ids){
 Q.order=ids||QUESTIONS.map(q=>q.id);if(Q.sq)Q.order=shuffle(Q.order);
 Q.i=0;Q.score=0;Q.wrong=[];Q.total=Q.order.length;loadQ();renderQuiz();
}
function loadQ(){Q.sel=null;Q.keys=Q.so?shuffle(["A","B","C","D"]):["A","B","C","D"]}
function renderQuiz(){
 const el=$("#p-quiz");
 const tg=`<div class="row" style="margin-bottom:14px"><label class="tog"><input type="checkbox" id="tq" ${Q.sq?"checked":""}> Trộn câu</label><label class="tog"><input type="checkbox" id="to" ${Q.so?"checked":""}> Trộn đáp án</label><span class="muted" style="margin-left:auto">Điểm cao nhất: <span class="stamp">${S.high}/${QUESTIONS.length}</span></span></div>`;
 if(Q.i>=Q.order.length){
  const pct=Math.round(Q.score/Q.total*100);
  if(Q.total===QUESTIONS.length&&Q.score>S.high){S.high=Q.score;save();toast("Kỷ lục mới: "+Q.score+"/"+Q.total)}
  el.innerHTML=tg+`<div class="box" style="text-align:center"><h2>Tổng kết</h2><div class="score">${Q.score}/${Q.total}</div><div class="muted">${pct}% câu đúng</div>${orn()}
  ${Q.wrong.length?`<div style="text-align:left"><h2 style="font-size:18px">Câu làm sai (${Q.wrong.length})</h2>${Q.wrong.map(id=>{const q=qById(id);return `<div class="wl"><span class="cn2">Câu ${q.id}</span>${q.question}<br><b style="color:var(--correct)">✅ ${q.answer}. ${q.options[q.answer]}</b></div>`}).join("")}</div>`:'<p>Không sai câu nào. Xuất sắc!</p>'}
  <div class="row c" style="margin-top:18px">${Q.wrong.length?'<button class="btn" id="rw">Làm lại câu sai</button>':""}<button class="btn ghost" id="ra">Làm lại từ đầu</button></div></div>`;
  bindTog();const rw=$("#rw");if(rw)rw.onclick=()=>quizStart(Q.wrong.slice());$("#ra").onclick=()=>quizStart();return;
 }
 const q=qById(Q.order[Q.i]);
 el.innerHTML=tg+`<div class="row" style="justify-content:space-between"><span class="stamp">Câu ${Q.i+1}/${Q.total}</span><span class="muted">Mã câu #${q.id}</span></div>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.total}" aria-valuenow="${Q.i+1}"><i style="width:${(Q.i+1)/Q.total*100}%"></i></div>
 <div class="box" id="qbox"><p class="qtext">${q.question}</p>
 ${Q.keys.map((k,n)=>`<button class="opt" data-k="${k}"><span class="k">${"ABCD"[n]}</span><span>${q.options[k]}</span><span class="mk"></span></button>`).join("")}
 <div id="fb"></div></div>`;
 bindTog();
 el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(b.dataset.k));
}
function bindTog(){
 const a=$("#tq"),b=$("#to");
 a.onchange=()=>{Q.sq=a.checked;toast(Q.sq?"Đã bật trộn câu · làm lại từ đầu":"Đã tắt trộn câu · làm lại từ đầu");quizStart()};
 b.onchange=()=>{Q.so=b.checked;toast(Q.so?"Đã bật trộn đáp án · làm lại từ đầu":"Đã tắt trộn đáp án · làm lại từ đầu");quizStart()};
}
function pick(k){
 if(Q.sel)return;Q.sel=k;
 const q=qById(Q.order[Q.i]),box=$("#qbox"),good=k===q.answer;
 box.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const bk=b.dataset.k,m=b.querySelector(".mk");
  if(bk===q.answer){b.classList.add("ok");m.textContent="✅"}
  else if(bk===k){b.classList.add("no");m.textContent="❌"}});
 if(good){Q.score++;const s=document.createElement("div");s.className="sealstamp";s.setAttribute("aria-hidden","true");s.textContent="ĐÚNG";box.append(s)}
 else{Q.wrong.push(q.id);box.classList.add("shake")}
 const last=Q.i+1>=Q.order.length;
 $("#fb").innerHTML=`<div class="note">${good?"✅ Chính xác. ":"❌ Chưa đúng. "}${q.explain}</div><div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="nx">${last?"Xem kết quả":"Câu tiếp →"}</button></div>`;
 $("#nx").focus();$("#nx").onclick=()=>{Q.i++;loadQ();renderQuiz();window.scrollTo({top:0})};
}

/* ===== FLASHCARD ===== */
const F={queue:[],flip:false};
const kwRe=new RegExp("("+KW.slice().sort((a,b)=>b.length-a.length).map(esc).join("|")+")","gi");
const hl=t=>t.replace(kwRe,'<span class="kw">$1</span>');
function cardsInit(){F.queue=shuffle(CARDS.filter(c=>!S.done.includes(c.id)).map(c=>c.id));F.flip=false;renderCards()}
function renderCards(){
 const el=$("#p-cards"),left=CARDS.length-S.done.length;
 const head=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Flashcard</h2><span class="stamp">Còn ${left} / ${CARDS.length} thẻ chưa nhớ</span></div>`;
 if(!F.queue.length){el.innerHTML=head+`<div class="box" style="text-align:center;margin-top:18px"><h2>Đã nhớ hết ${CARDS.length} thẻ</h2><p class="muted">Ôn lại từ đầu để khắc sâu hơn.</p><button class="btn" id="fr">Ôn lại tất cả</button></div>`;$("#fr").onclick=()=>{S.done=[];save();cardsInit()};return}
 const c=CARDS.find(x=>x.id===F.queue[0]);
 const cn='<i class="cn a"></i><i class="cn b"></i><i class="cn c"></i><i class="cn d"></i>';
 el.innerHTML=head+`<div class="scene"><div class="fc ${F.flip?"flip":""}" id="fc" role="button" tabindex="0" aria-label="Lật thẻ"><div class="face">${cn}<div class="muted" style="text-align:center;font:12px var(--mono);margin-bottom:10px">THẺ #${c.id}</div><h3>${c.title}</h3><div class="tags">${c.tags.map(t=>`<span>${t}</span>`).join("")}</div><div class="muted" style="text-align:center;margin-top:16px;font-size:14px">Bấm để lật</div></div>
 <div class="face back">${cn}<ul>${c.points.map(p=>`<li>${hl(p)}</li>`).join("")}</ul></div></div></div>
 <div class="row c"><button class="btn ghost" id="fn" aria-label="Chưa nhớ">❌ Chưa nhớ</button><button class="btn" id="fy" aria-label="Nhớ rồi">✅ Nhớ rồi</button><button class="btn ghost" id="fs" aria-label="Xáo thẻ">🔀 Xáo thẻ</button></div>`;
 const fc=$("#fc"),tf=()=>{F.flip=!F.flip;fc.classList.toggle("flip",F.flip)};
 fc.onclick=tf;fc.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tf()}};
 $("#fn").onclick=()=>{const id=F.queue.shift();F.queue.push(id);S.done=S.done.filter(x=>x!==id);save();F.flip=false;renderCards()};
 $("#fy").onclick=()=>{const id=F.queue.shift();if(!S.done.includes(id))S.done.push(id);save();F.flip=false;renderCards()};
 $("#fs").onclick=()=>{F.queue=shuffle(F.queue);F.flip=false;renderCards();toast("Đã xáo thẻ")};
}

/* ===== ĐIỀN KHUYẾT ===== */
function renderCloze(){
 const el=$("#p-cloze");let n=0;
 const items=CLOZES.map(c=>{
  c.blanks=[...c.text.matchAll(/\{\{(.+?)\}\}/g)].map((m,i)=>({answer:m[1],hint:(c.hints||[])[i]||""}));
  let i=0;const html=c.text.replace(/\{\{(.+?)\}\}/g,(_,a)=>{const b=c.blanks[i++];n++;return `<input type="text" data-a="${a.replace(/"/g,"&quot;")}" placeholder="${b.hint}" aria-label="Chỗ trống ${n}: ${b.hint}" style="width:${Math.max(8,a.length*.65+2)}em" autocomplete="off" spellcheck="false"><span class="ck"></span>`});
  return `<div class="cz box"><span class="cn2">Đoạn ${c.id}</span>${html}</div>`}).join("");
 el.innerHTML=`<h2>Điền khuyết</h2><p class="muted">Gõ vào chỗ trống; không dấu hoặc viết hoa/thường đều được chấp nhận.</p><div class="row" style="margin:10px 0"><span class="stamp" id="cs">Đúng –/${n}</span></div>${items}
 <div class="row c"><button class="btn" id="cc">Kiểm tra</button><button class="btn ghost" id="ca">Xem đáp án</button><button class="btn ghost" id="cr">Làm lại</button></div>`;
 const ins=()=>[...el.querySelectorAll("input")];
 $("#cc").onclick=()=>{let ok=0,empty=0;ins().forEach(i=>{const a=i.dataset.a,ck=i.nextElementSibling;if(!i.value.trim()){empty++}
   const good=norm(i.value)===norm(a);i.classList.remove("ok","bad");i.classList.add(good?"ok":"bad");if(good)ok++;
   ck.innerHTML=good?" ✅":` ❌ <span class="chip">${a}</span>`});
  $("#cs").textContent=`Đúng ${ok}/${n}`;toast(`Đúng ${ok}/${n}`+(empty?` · ${empty} ô còn trống`:""))};
 $("#ca").onclick=()=>{ins().forEach(i=>{i.value=i.dataset.a;i.classList.remove("bad");i.classList.add("ok");i.nextElementSibling.textContent=""});$("#cs").textContent=`Đúng –/${n}`;toast("Đã hiện đáp án")};
 $("#cr").onclick=()=>{ins().forEach(i=>{i.value="";i.classList.remove("ok","bad");i.nextElementSibling.textContent=""});$("#cs").textContent=`Đúng –/${n}`;toast("Đã làm mới")};
}

/* ===== LÝ THUYẾT ===== */
const T={open:new Set(),q:""};
function renderTheory(){
 const el=$("#p-theory"),q=T.q.trim(),nq=norm(q),re=q?new RegExp("("+esc(q)+")","gi"):null;
 const mark=t=>re?t.replace(re,"<mark>$1</mark>"):t;
 let list=THEORY.filter(t=>!nq||norm(t.title+t.body.join(" ")).includes(nq));
 list=list.sort((a,b)=>S.pins.includes(b.id)-S.pins.includes(a.id));
 const body=b=>b.map(l=>l.startsWith("## ")?`<h4>${mark(l.slice(3))}</h4>`:l.startsWith("=>")?`<p class="ar">${mark(l)}</p>`:l.startsWith("+")?`<p class="l2">${mark(l)}</p>`:l.startsWith("-")?`<p class="l1">${mark(l)}</p>`:`<p>${mark(l)}</p>`).join("");
 el.innerHTML=`<h2>Lý thuyết tự luận</h2><p class="muted">Bấm 📌 để ghim mục hay quên lên đầu.</p>
 <div class="row" style="margin:10px 0 16px"><input class="search" id="sq" type="search" placeholder="Tìm từ khoá…" aria-label="Tìm từ khoá" value="${q.replace(/"/g,"&quot;")}"><button class="btn ghost" id="oa">Mở tất cả</button><button class="btn ghost" id="ca2">Đóng tất cả</button></div>
 ${list.length?list.map(t=>{const open=T.open.has(t.id)||(nq&&true),pin=S.pins.includes(t.id);return `<div class="ac ${open?"open":""} ${pin?"pin":""}" data-id="${t.id}"><div class="ach"><button class="t" aria-expanded="${!!open}"><span class="arr">▶</span><span>${mark(t.title)}</span></button><button class="pb" aria-pressed="${pin}" aria-label="${pin?"Bỏ ghim":"Ghim"} mục ${t.id}">📌</button></div><div class="acb">${body(t.body)}</div></div>`}).join(""):'<p class="muted">Không tìm thấy mục nào khớp.</p>'}`;
 const s=$("#sq");s.oninput=()=>{T.q=s.value;const p=s.selectionStart;renderTheory();const n=$("#sq");n.focus();n.setSelectionRange(p,p)};
 el.querySelectorAll(".ac").forEach(a=>{const id=+a.dataset.id;
  a.querySelector(".t").onclick=()=>{T.open.has(id)?T.open.delete(id):T.open.add(id);if(nq){T.q="";}renderTheory()};
  a.querySelector(".pb").onclick=()=>{const i=S.pins.indexOf(id);i<0?S.pins.push(id):S.pins.splice(i,1);save();toast(i<0?"Đã ghim mục "+id:"Đã bỏ ghim mục "+id);renderTheory()}});
 $("#oa").onclick=()=>{THEORY.forEach(t=>T.open.add(t.id));renderTheory()};
 $("#ca2").onclick=()=>{T.open.clear();T.q="";renderTheory()};
}

/* ===== INIT ===== */
quizStart();cardsInit();renderCloze();renderTheory();
showTab(["quiz","cards","cloze","theory"].includes(S.tab)?S.tab:"quiz");
</script>
</body>
</html>
